name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not integration" --cov=core --cov=attacks --cov-report=term-missing --cov-fail-under=70
      - name: Video integration tests
        if: matrix.python-version == '3.12'
        run: pytest -m integration
      - name: Asset-generator smoke test
        if: matrix.python-version == '3.12'
        run: python generate_assets.py --output-dir /tmp/generated-assets
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
