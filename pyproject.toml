[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-invisible-watermark"
version = "1.0.0"
description = "Keyed DWT-DCT-STDM/SVD invisible watermarking for images and video"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DSP Invisible Watermark contributors" }]
keywords = ["watermarking", "digital-signal-processing", "dwt", "dct", "svd", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyWavelets>=1.5,<2",
  "opencv-python>=4.8,<6",
  "ffmpeg-python==0.2.0",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "build>=1.2,<2",
]

[project.scripts]
dsp-watermark = "cli:main"

[project.urls]
Repository = "https://github.com/eshwar-iiti/dsp-invisible-watermark"
Issues = "https://github.com/eshwar-iiti/dsp-invisible-watermark/issues"

[tool.setuptools]
py-modules = ["cli", "generate_assets"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "attacks*", "benchmarks*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: invokes video codecs/FFmpeg and can take several seconds",
]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
